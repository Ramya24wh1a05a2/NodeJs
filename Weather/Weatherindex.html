<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="
    text-align:center;
    font-family: Arial;
    background: linear-gradient(to right, #dfe9f3, #ffffff);
    padding-top: 40px;
">
      <h1>V.Ramya 24WH1A05A2</h1>
    <h2>🌤️ Weather App</h2>

    <!-- Input -->
    <input type="text" id="city" placeholder="Enter city"
    style="padding:10px; border-radius:10px; border:1px solid #ccc;">

    <!-- Button -->
    <button onclick="getWeather()"
    style="padding:10px 15px; border:none; border-radius:10px; background:#4A90E2; color:white; cursor:pointer;">
    Get Weather
    </button>

    <br><br>

    <!-- Chart Container -->
    <div style="
        width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    ">
        <canvas id="weatherChart"></canvas>
    </div>

<script>
const apiKey = "96b3f525c5ec772eeb957c0887e64b9f"; // 🔴 paste your OpenWeather API key here

let chart;

async function getWeather() {
    const city = document.getElementById("city").value;

    if (!city) {
        alert("Enter city name");
        return;
    }

    try {
        const url = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.cod !== "200") {
            alert(data.message);
            return;
        }

        const temps = data.list.slice(0, 8).map(x => x.main.temp);
        const times = data.list.slice(0, 8).map(x => x.dt_txt);

        const ctx = document.getElementById("weatherChart").getContext("2d");

        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: "line",
            data: {
                labels: times,
                datasets: [{
                    label: "Temperature (°C)",
                    data: temps,
                    borderColor: "#4A90E2",
                    backgroundColor: "rgba(74,144,226,0.2)",
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        labels: {
                            font: { size: 14 }
                        }
                    }
                }
            }
        });

    } catch (e) {
        console.error(e);
        alert("Error fetching data");
    }
}
</script>

</body>
</html>
