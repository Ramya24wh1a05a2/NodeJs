<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <h2>Session Tracking</h2>
    <p>{{username}}</p>
</nav>

<div class="main">

<div class="sidebar">
    <a href="/dashboard">Dashboard</a>
    <a href="/activity">Activity</a>
    <a href="/cookie-test">Cookies</a>
    <a href="/logout">Logout</a>
</div>

<div class="content">

<div class="card">
    <h2>Welcome, {{username}}</h2>
    <p>Session Active</p>
</div>

<div class="cards">
    <div class="card">
        <h3>Status</h3>
        <p>Active</p>
    </div>

    <div class="card">
        <h3>Activities</h3>
        <p>{{activityCount}}</p>
    </div>

    <div class="card">
        <h3>Login Time</h3>
        <p>{{loginTime}}</p>
    </div>
</div>

</div>
</div>

</body>
</html>
